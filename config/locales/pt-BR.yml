pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
      long: "%d de %B de %Y"    # ex: 31 de agosto de 2025
      short: "%d/%m"
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      long: "%d de %B de %Y %H:%M"
      short: "%d/%m %H:%M"
  errors:
